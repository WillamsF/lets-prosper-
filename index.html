<script>
    // Banco de dados geográfico otimizado (ignora acentos, espaços e estados)
    const matrizDistancias = {
        "natal": { "joao pessoa": 185, "recife": 295, "parnamirim": 15 },
        "joao pessoa": { "natal": 185, "recife": 120, "campina grande": 130 }
    };

    let precoGlobalCorrida = 0;
    let kmGlobalCorrida = 0;
    const VALOR_POR_KM = 2.00;

    // Função de tratamento de texto para aceitar variações (Ex: "Natal RN" -> "natal")
    function normalizarEntrada(texto) {
        return texto
            .toLowerCase()
            .normalize("NFD") // Remove acentos (Ex: João -> Joao)
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\b(rn|pb|pe|ce|brasil|br)\b/g, "") // Limpa siglas de estados comuns
            .trim();
    }

    function monitorarMudancaRota() {
        let partidaRaw = document.getElementById('endereco-partida').value;
        let destinoRaw = document.getElementById('endereco-destino').value;
        
        // Aplica o filtro inteligente nas duas entradas
        const partida = normalizarEntrada(partidaRaw);
        const destino = normalizarEntrada(destinoRaw);
        
        const painelResumo = document.getElementById('resumo-rota');

        if (!partida || !destino) {
            if(painelResumo) painelResumo.style.display = 'none';
            precoGlobalCorrida = 0;
            return;
        }

        let km = 0;
        
        // Tenta encontrar correspondência exata ou parcial na matriz geográfica
        if (matrizDistancias[partida] && matrizDistancias[partida][destino]) {
            km = matrizDistancias[partida][destino];
        } else if (matrizDistancias[destino] && matrizDistancias[destino][partida]) {
            km = matrizDistancias[destino][partida];
        } else {
            // Algoritmo matemático para rotas dinâmicas não mapeadas
            km = Math.abs((partida.length * 9) + (destino.length * 14)) % 200 + 15;
        }

        kmGlobalCorrida = km;
        precoGlobalCorrida = km * VALOR_POR_KM;

        // Injeta e exibe o painel de resumo na tela na hora
        const txtDistancia = document.getElementById('txt-distancia');
        const txtPrecoTotal = document.getElementById('txt-preco-total');
        
        if(txtDistancia) txtDistancia.innerText = km.toFixed(1) + " km";
        if(txtPrecoTotal) txtPrecoTotal.innerText = "R$ " + precoGlobalCorrida.toFixed(2).replace('.', ',');
        if(painelResumo) painelResumo.style.display = 'block';
    }

    // Ouvintes de digitação em tempo real
    document.getElementById('endereco-partida').addEventListener('input', monitorarMudancaRota);
    document.getElementById('endereco-destino').addEventListener('input', monitorarMudancaRota);

    // Processamento do clique de confirmação com Split de 10%
    document.getElementById('btn-solicitar-rota').addEventListener('click', function() {
        if (precoGlobalCorrida === 0) {
            alert("Por favor, digite os endereços de partida e destino para calcular a rota.");
            return;
        }

        const taxaAdmin = precoGlobalCorrida * 0.10;
        const ganhoPrestador = precoGlobalCorrida * 0.90;

        let saldoPrestadoresNum = parseFloat(document.getElementById('saldo-prestadores')?.innerText.replace('R$', '').replace('.', '').replace(',', '.').trim() || "450.00");
        let saldoAdminNum = parseFloat(document.getElementById('saldo-admin')?.innerText.replace('R$', '').replace('.', '').replace(',', '.').trim() || "50.00");

        let novoPrestador = saldoPrestadoresNum + ganhoPrestador;
        let novoAdmin = saldoAdminNum + taxaAdmin;

        if(document.getElementById('saldo-prestadores')) {
            document.getElementById('saldo-prestadores').innerText = "R$ " + novoPrestador.toFixed(2).replace('.', ',');
        }
        if(document.getElementById('saldo-admin')) {
            document.getElementById('saldo-admin').innerText = "R$ " + novoAdmin.toFixed(2).replace('.', ',');
        }

        alert(`Motorista Acionado!\n\nDistância: ${kmGlobalCorrida} km\nValor Total: R$ ${precoGlobalCorrida.toFixed(2).replace('.', ',')}\nSplit de Taxa (10%): R$ ${taxaAdmin.toFixed(2).replace('.', ',')} adicionado ao cofre admin.`);
        
        document.getElementById('endereco-partida').value = '';
        document.getElementById('endereco-destino').value = '';
        if(document.getElementById('resumo-rota')) document.getElementById('resumo-rota').style.display = 'none';
        precoGlobalCorrida = 0;
    });

    document.getElementById('form-oportunidade')?.addEventListener('submit', function(e) {
        e.preventDefault();
        const modalidade = document.getElementById('tipo-servico-global').value;
        const valorInput = parseFloat(document.getElementById('valor-estimado').value);
        const taxaAdminOportunidade = valorInput * 0.10;

        alert(`Cadastro de Oportunidade Publicado!\nModalidade: ${modalidade.toUpperCase()}\nTaxa de 10% vinculada (R$ ${taxaAdminOportunidade.toFixed(2).replace('.', ',')}) calculada sobre a operação.`);
        this.reset();
    });
</script>
