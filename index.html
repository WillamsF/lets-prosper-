<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Prosper - Global Multisserviços & Logística</title>
    <!-- Correção de link de estilização estável -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .bloco { bg-color: #1e293b; border: 1px solid #334155; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        input, select, button { padding: 8px; margin: 4px 0; border-radius: 6px; }
        button { cursor: pointer; background-color: #10b981; color: #000; font-weight: bold; border: none; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- BARRA GLOBAL -->
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:10px; margin-bottom:20px;">
        <h2>Let's <span style="color:#10b981">Prosper</span> Global</h2>
        <div>
            <select id="selectIdioma" onchange="mudarIdiomaMoeda()">
                <option value="pt">🇧🇷 Português</option>
                <option value="en">🇺🇸 English</option>
            </select>
            <select id="selectMoeda" onchange="mudarIdiomaMoeda()">
                <option value="BRL">BRL (R$)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
            </select>
        </div>
    </div>

    <!-- CARTEIRA DIGITAL REFORÇADA -->
    <div class="bloco" style="background:#020617;">
        <h3 id="titCarteira">⚡ Carteira Digital Automatizada</h3>
        <p><b id="lblSaldoDisp">Saldo Disponível (90%):</b> <span id="cardSaldo" style="font-size:18px; color:#fff; font-weight:bold;">R$ 450,00</span></p>
        <p><b id="lblRetencaoAcum">Sua Taxa Retida (10%):</b> <span id="cardTaxaAcum" style="font-size:18px; color:#10b981; font-weight:bold;">R$ 50,00</span></p>
    </div>

    <!-- LOGÍSTICA MAPAS -->
    <div class="bloco">
        <h3 id="titLogistica">🗺️ Central de Logística Urbana (Google Maps)</h3>
        <div class="flex">
            <input type="text" id="partida" placeholder="Origem / Start" style="width:50%;">
            <input type="text" id="destino" placeholder="Destino / Destination" style="width:50%;">
        </div>
        <button type="button" onclick="calcularRotaGlobal()" id="btnCalcular" style="margin-top:10px; width:100%;">Processar Rota e Reter 10%</button>
        
        <div id="reciboFinancas" style="margin-top:15px; display:none; background:#020617; padding:10px; border-radius:6px;">
            <p><span id="lblReciboTotal">Total do Cliente:</span> <span id="valTotal" style="font-weight:bold; color:#fff;"></span></p>
            <p><span id="lblReciboTaxa">Sua Taxa (10% Protegido):</span> <span id="valTaxa" style="font-weight:bold; color:#10b981;"></span></p>
        </div>
    </div>

    <script>
        const dadosConversao = {
            BRL: { simb: "R$ ", tx: 1 },
            USD: { simb: "$ ", tx: 0.18 },
            EUR: { simb: "€ ", tx: 0.17 }
        };

        const textos = {
            pt: { titC: "⚡ Carteira Digital Automatizada", sal: "Saldo Disponível (90%):", tax: "Sua Taxa Retida (10%):", log: "🗺️ Central de Logística Urbana (Google Maps)", btn: "Processar Rota e Reter 10%", tCli: "Total do Cliente:", tTax: "Sua Taxa (10% Protegido):" },
            en: { titC: "⚡ Automated Digital Wallet", sal: "Available Balance (90%):", tax: "Your Retained Fee (10%):", log: "🗺️ Urban Logistics Center (Google Maps)", btn: "Process Route & Retain 10%", tCli: "Customer Total:", tTax: "Your Fee (10% Secured):" }
        };

        function mudarIdiomaMoeda() {
            const m = document.getElementById('selectMoeda').value;
            const lang = document.getElementById('selectIdioma').value;
            const s = dadosConversao[m].simb;
            const f = dadosConversao[m].tx;

            // Altera os valores fixos da carteira de forma direta e imutável pelas tags
            document.getElementById('cardSaldo').innerText = s + (450 * f).toFixed(2);
            document.getElementById('cardTaxaAcum').innerText = s + (50 * f).toFixed(2);

            // Altera os idiomas sem depender dos textos do HTML antigo
            if(textos[lang]) {
                document.getElementById('titCarteira').innerText = textos[lang].titC;
                document.getElementById('lblSaldoDisp').innerText = textos[lang].sal;
                document.getElementById('lblRetencaoAcum').innerText = textos[lang].tax;
                document.getElementById('titLogistica').innerText = textos[lang].log;
                document.getElementById('btnCalcular').innerText = textos[lang].btn;
                document.getElementById('lblReciboTotal').innerText = textos[lang].tCli;
                document.getElementById('lblReciboTaxa').innerText = textos[lang].tTax;
            }
        }

        function calcularRotaGlobal() {
            const partida = document.getElementById('partida').value;
            const destino = document.getElementById('destino').value;
            if(!partida || !destino) { alert('Digite partida e destino.'); return; }

            const m = document.getElementById('selectMoeda').value;
            const s = dadosConversao[m].simb;
            const f = dadosConversao[m].tx;

            const baseBruta = (Math.random() * (80 - 30) + 30);
            const total = baseBruta * f;
            const taxa = total * 0.10;

            document.getElementById('valTotal').innerText = s + total.toFixed(2);
            document.getElementById('valTaxa').innerText = s + taxa.toFixed(2);
            document.getElementById('reciboFinancas').style.display = 'block';
        }

        // Executa a inicialização limpa
        mudarIdiomaMoeda();
    </script>
</body>
</html>
